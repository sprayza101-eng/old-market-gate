<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ด่านตลาดเก่า ออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#DDC7A9; --surface:#F4E9D8; --surface2:#E9D9C0; --ink:#3A2917; --dim:#735D45; --line:#C3A67F;
  --gold:#D9A05B; --goldink:#2E1B08; --goldtext:#7A4A14;
  --wax:#963A2A; --waxbg:#EFD0C3; --leaf:#4E6A38; --leafbg:#DDE5C6;
  --shadow:0 1px 2px rgba(58,41,23,.10),0 10px 26px rgba(58,41,23,.14);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#241A12; --surface:#33261A; --surface2:#402F21; --ink:#F2E5D1; --dim:#BDA98F; --line:#5B4630;
    --gold:#E0A85F; --goldink:#2A1806; --goldtext:#E0A85F;
    --wax:#EA8570; --waxbg:#4B2B22; --leaf:#A9C47F; --leafbg:#34412A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#241A12; --surface:#33261A; --surface2:#402F21; --ink:#F2E5D1; --dim:#BDA98F; --line:#5B4630;
  --gold:#E0A85F; --goldink:#2A1806; --goldtext:#E0A85F;
  --wax:#EA8570; --waxbg:#4B2B22; --leaf:#A9C47F; --leafbg:#34412A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.7 'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:'Chonburi','IBM Plex Sans Thai',serif;font-weight:400;line-height:1.45;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dim{color:var(--dim)}
.sm{font-size:14px}

/* header */
.top,main,.strip,.bar{max-width:720px;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 8px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Chonburi',serif;font-size:18px}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.round{font-size:14px;color:var(--dim);margin-right:4px;white-space:nowrap}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.ghost:hover{background:var(--surface2)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 16px 8px;padding:10px 14px;border-radius:12px;background:var(--waxbg);color:var(--ink);font-size:15px}
.bar .row{display:flex;gap:6px}

/* player strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:thin}
.pl{flex:0 0 auto;min-width:108px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.pl.sheriff{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pn{font-weight:600;font-size:15px;line-height:1.4;display:flex;align-items:center;gap:6px;white-space:nowrap}
.goodsbtn{background:var(--gold);border-color:var(--gold);color:var(--goldink);font-weight:700;font-size:15px;padding:8px 16px;min-height:40px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.goodsbtn:hover{background:var(--gold);filter:brightness(1.08)}
.gdrow{padding:12px 14px}
.gdhead b{font-size:18px}
.gdemoji{font-size:30px}
.gdstats{font-size:15px;gap:6px}
.gdstats span:first-child{font-size:18px;color:var(--ink);font-weight:600}
.goodsov{display:flex;align-items:center;padding:6px}
.gsheet{width:100%;max-width:640px;padding:10px 8px;margin:auto}
.gsheet>*+*{margin-top:5px}
.gsheet h2{font-size:19px;text-align:center;margin:0}
.gtable{width:100%;border-collapse:collapse;font-size:14px;table-layout:auto}
.gtable th,.gtable td{padding:2px 3px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;vertical-align:middle}
.gtable th{font-size:12.5px;color:var(--ink);font-weight:700;line-height:1.2}
.gtable th small{display:block;font-size:10.5px;font-weight:400;color:var(--dim)}
.gtable .gn{text-align:left;font-weight:600}
.gtable .ge{font-size:19px;margin-right:3px;vertical-align:middle}
.gtable td.v,.gtable td.p{font-size:19px;font-weight:700}
.gtable td.p{color:var(--wax)}
.gtable td.b{font-size:16px;font-weight:700;color:var(--goldtext)}
.gtable td.q{font-weight:600}
.gtable td.gx{text-align:left}
.gtable .grp td{text-align:left;background:var(--surface2);font-weight:700;font-size:13px;padding:4px 6px;white-space:normal}
.gsub{font-size:11px;font-weight:400;color:var(--dim);margin-left:2px}
.chip{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:0 8px;line-height:1.6;white-space:nowrap}
.chip.x{background:var(--waxbg);border:1px solid var(--wax);color:var(--ink)}
.gnote{font-size:11px;color:var(--dim);line-height:1.4;margin:0}
.gsheet .btn{min-height:40px}
.badge{font-size:11px;font-weight:600;background:var(--gold);color:var(--goldink);border-radius:999px;padding:0 8px;line-height:1.6}
.pc{display:flex;align-items:center;gap:6px;font-family:'Chonburi',serif;font-size:18px;line-height:1.5}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 3px rgba(60,30,0,.2)}
.ps{font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:2px 8px;min-height:20px}
.ps .x{border-bottom:2px solid var(--wax)}

/* main stage */
main{padding:0 16px 40px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow)}
.stage>*+*{margin-top:16px}
.stage h2{font-size:24px}
.lead{font-size:16px;color:var(--dim)}
.center{text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:600;cursor:pointer;line-height:1.4;text-align:center}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.btn.danger{background:var(--wax);border-color:var(--wax);color:#fff}
.btn.block{display:flex;width:100%}
.btns{display:grid;gap:10px}
.btns.two{grid-template-columns:1fr 1fr}

/* setup */
.hero{display:flex;gap:16px;align-items:center}
.hero h1{font-size:30px}
.hero svg,.hero .sackimg{flex:0 0 auto;width:120px;height:auto;transform:rotate(-6deg)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:600;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
.fld{display:block}
.fld>span{display:block;font-size:14px;color:var(--dim)}
.fld input{width:100%;min-height:44px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.names{display:grid;gap:10px}
.prow{display:flex;gap:8px;align-items:flex-end}
.prow .fld{flex:1}
.prow .rm{flex:0 0 auto;width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;font-size:18px;color:var(--ink)}
.prow .rm:disabled{opacity:.4;cursor:not-allowed}
h3.lb{font-size:16px;font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600}

/* handoff */
.handoff{text-align:center;padding:36px 18px}
.handoff h2{font-size:34px}

/* cards */
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.hand{grid-template-columns:repeat(6,1fr)}}
.card,.face{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);overflow:hidden;padding:0}
.card img,.face img,.thumb{display:block;width:100%;height:100%;object-fit:cover}
.card{cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.card:disabled{cursor:default}
.tag{position:absolute;font-size:11px;font-weight:600;line-height:1.5;padding:0 8px;border-radius:999px;background:var(--surface2)}
.card .tag,.face .tag{left:6px;top:6px}
.tag.contra{background:var(--waxbg);color:var(--wax)}
.tag.good{background:var(--leafbg);color:var(--leaf);left:auto;right:6px;top:auto;bottom:6px}
.tag.seized{background:var(--waxbg);color:var(--wax);left:auto;right:6px;top:auto;bottom:6px}
.legal{box-shadow:inset 0 -5px 0 var(--leaf)}
.contra{box-shadow:inset 0 -5px 0 var(--wax)}
.card.sel{transform:translateY(-8px);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),var(--shadow)}
.card.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--goldink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.face.bad{border-color:var(--wax)}
.face.ok{border-color:var(--leaf)}
.cards-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cards-row .face{width:92px}

.piles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pile{min-height:92px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface2);padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;line-height:1.4;text-align:center}
.pile:hover:not(:disabled){border-color:var(--dim)}
.pile:disabled{opacity:.45;cursor:not-allowed}
.pile .em{font-size:26px;line-height:1.2}
.pile b{font-weight:600}
.pile img.thumb{width:44px;height:auto;aspect-ratio:9/16;border-radius:6px;object-fit:cover}

.steps{display:flex;gap:8px;font-size:14px;color:var(--dim)}
.steps span{padding:0 10px;border-radius:999px;border:1px solid var(--line)}
.steps .on{background:var(--gold);border-color:var(--gold);color:var(--goldink);font-weight:600}

.decl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.decl button{min-height:64px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;line-height:1.35;color:var(--ink)}
.decl button .em{font-size:24px;line-height:1.2}
.decl button img.sm4{width:34px;height:auto;aspect-ratio:9/16;border-radius:6px;object-fit:cover}
.decl button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);background:var(--surface)}
.gfallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:40px}
.thumb.gfallback,.sm4.gfallback{font-size:22px}
.note{padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.6}
.note.t{background:var(--leafbg);color:var(--ink)}
.note.f{background:var(--waxbg);color:var(--ink)}

/* inspect */
.sackwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.sackwrap svg,.sackwrap .sackimg{width:150px;height:auto}
.declared{font-family:'Chonburi',serif;font-size:26px;line-height:1.5;text-align:center}
.bribe{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.bribe input{width:84px;text-align:center;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:20px}
.step{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-size:22px;font-weight:600;cursor:pointer;color:var(--ink)}
.face{animation:pop .42s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) rotateY(80deg) scale(.9)}to{opacity:1;transform:none}}
.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.face,.shake{animation:none}.card{transition:none}}

.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.log li{padding:8px 12px;border-left:3px solid var(--gold);background:var(--surface2);border-radius:0 8px 8px 0}

/* final */
.rank{display:grid;gap:10px}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.rk.win{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:var(--surface)}
.rk .no{font-family:'Chonburi',serif;font-size:22px;text-align:center}
.rk .nm{font-weight:600}
.rk .tot{font-family:'Chonburi',serif;font-size:24px}
.rk .brk{grid-column:2/4;font-size:14px;color:var(--dim);line-height:1.6}
.kq{display:grid;gap:6px;font-size:15px}

/* rules overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(40,24,10,.6);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--shadow)}
.sheet>*+*{margin-top:14px}
.sheet ul,.sheet ol{margin:0;padding-left:22px;display:grid;gap:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.5}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:500}

/* goods overlay */
.gdlist{display:grid;gap:10px}
.gdrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.gdhead{display:flex;align-items:center;gap:8px}
.gdemoji{font-size:22px;line-height:1}
.gdstats{margin-top:6px;display:grid;gap:4px;font-size:13.5px;color:var(--dim);line-height:1.5}
.gdstats b{color:var(--ink)}
.badge.x{background:var(--wax);color:#fff}

/* ออนไลน์ */
.code{font-family:'Chonburi',serif;font-size:15px;letter-spacing:.08em;padding:2px 10px;border-radius:999px;background:var(--gold);color:var(--goldink)}
.bar.ok{background:var(--leafbg)}
.bigcode{font-size:44px;letter-spacing:.14em}
.linkbox{width:100%;min-height:44px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font-size:14px}
.plist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:0 0 auto}
.dot.on{background:var(--leaf)}
.off{font-size:11px;color:var(--wax);font-weight:600}
.botbadge{font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:18px}
.discord{text-decoration:none;display:flex;align-items:center;justify-content:center;background:#5865F2;border-color:#5865F2;color:#fff}
.discord:hover{opacity:.92}
.pl.me{background:var(--surface2)}
.chat{max-width:720px;margin:0 auto;padding:0 16px 32px}
.chat h3{font-size:16px;font-family:'IBM Plex Sans Thai',sans-serif;font-weight:600;margin-bottom:6px}
.chatlog{height:190px;overflow-y:auto;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:6px;align-content:start;font-size:15px;line-height:1.55}
.chatlog .msg b{color:var(--goldtext)}
.chatlog .msg.mine{text-align:right}
.chatform{display:flex;gap:8px;margin-top:8px}
.chatform input{flex:1;min-height:44px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.chatform .btn{min-height:44px}
[hidden]{display:none!important}
.awards{display:grid;gap:8px}
.aw{display:grid;grid-template-columns:40px 1fr;gap:0 10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.aw .ic{font-size:26px;grid-row:span 2;text-align:center;line-height:1.2}
.aw .d{color:var(--dim);font-size:14px}
.strow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.stp{display:flex;align-items:center;gap:12px}
.step.sm3{width:38px;height:38px;font-size:18px}
.sm2{min-height:34px;padding:2px 12px;font-size:14px}
.plist li .btn,.plist li .pair{margin-left:auto}
.plist li .pair{display:flex;gap:6px}
</style>
</head>
<body>
<div id="hdr"></div>
<div id="bars"></div>
<div id="strip"></div>
<main id="view"></main>
<section id="chat" class="chat" hidden>
  <h3>แชตในห้อง</h3>
  <div id="chatlog" class="chatlog" aria-live="polite"></div>
  <div class="chatform"><input id="chatinp" maxlength="200" autocomplete="off" placeholder="พิมพ์ข้อความ…" aria-label="ข้อความแชต"><button id="chatsend" class="btn primary">ส่ง</button></div>
</section>
<div id="ov"></div>
<script>
/* กติกาเกม "ด่านตลาดเก่า" — ใช้ร่วมกันทั้งเซิร์ฟเวอร์ (Node) และเบราว์เซอร์ */
(function(root,factory){
  if(typeof module==='object'&&module.exports)module.exports=factory();
  else root.Engine=factory();
})(typeof self!=='undefined'?self:this,function(){
'use strict';

const GOODS={
  apple:{name:'แอปเปิล',emoji:'🍎',value:2,pen:2,legal:true,king:20,queen:10},
  cheese:{name:'ชีส',emoji:'🧀',value:3,pen:2,legal:true,king:15,queen:10},
  bread:{name:'ขนมปัง',emoji:'🍞',value:3,pen:2,legal:true,king:15,queen:10},
  chicken:{name:'ไก่',emoji:'🐔',value:4,pen:2,legal:true,king:10,queen:5},
  pepper:{name:'พริกไทย',emoji:'🌶️',value:6,pen:4,legal:false,bonus:{chicken:2}},
  mead:{name:'น้ำผึ้งหมัก',emoji:'🍯',value:7,pen:4,legal:false,bonus:{bread:2}},
  silk:{name:'ผ้าไหม',emoji:'🧵',value:8,pen:4,legal:false,bonus:{cheese:3}},
  crossbow:{name:'หน้าไม้',emoji:'🏹',value:9,pen:4,legal:false,bonus:{apple:2}}
};
const ALL=Object.keys(GOODS);
const LEGAL=ALL.filter(function(k){return GOODS[k].legal;});
const DECK_COUNTS={apple:48,cheese:36,bread:36,chicken:24,pepper:22,mead:21,silk:12,crossbow:5};
const HAND=6,BAG_MAX=5,DISCARD_MAX=5,START_COINS=50;

function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function emptyStall(){const o={};ALL.forEach(function(k){o[k]=0;});return o;}
function uniq(ids){return Array.from(new Set(ids));}

function newStats(){
  return {bags:0,lies:0,liesPassed:0,caught:0,honestOpened:0,inspected:0,passed:0,contrabandPassed:0,
    bribeGiven:0,bribeGivenCount:0,bribeTaken:0,bribeTakenCount:0,bountyGiven:0,penPaid:0,penGot:0};
}
function giftValue(g){
  let v=g.coins||0;
  Object.keys(g.stall||{}).forEach(function(t){v+=GOODS[t].value*g.stall[t];});
  (g.hand||[]).forEach(function(c){v+=GOODS[c.t].value;});
  return v;
}
function newGame(names,rounds,rnd,startCoins){
  rnd=rnd||Math.random;
  const sc=(startCoins==null||isNaN(startCoins))?START_COINS:Math.max(0,Math.min(999,startCoins|0));
  const S={
    nextId:1,extra:0,
    players:names.map(function(n){return {name:n,coins:sc,hand:[],stall:emptyStall()};}),
    deck:[],piles:[[],[]],
    rounds:rounds,totalRounds:names.length*rounds,roundNo:0,sheriff:0,
    merchants:[],prep:{},bags:{},inspIdx:0,offer:0,offerItems:{hand:[],stall:{}},bounty:{},last:null,phase:'prep',log:[]
  };
  S.stats=S.players.map(newStats);
  const scale=Math.max(1,Math.ceil(names.length/5));
  ALL.forEach(function(t){for(let i=0;i<DECK_COUNTS[t]*scale;i++)S.deck.push({id:S.nextId++,t:t});});
  shuffle(S.deck,rnd);
  S.players.forEach(function(p){for(let i=0;i<HAND;i++)p.hand.push(S.deck.pop());});
  for(let k=0;k<2;k++)for(let i=0;i<5;i++)S.piles[k].push(S.deck.pop());
  beginRound(S);
  return S;
}
function beginRound(S){
  const n=S.players.length;
  S.merchants=[];
  for(let i=1;i<n;i++)S.merchants.push((S.sheriff+i)%n);
  S.prep={};
  S.merchants.forEach(function(mi){S.prep[mi]={step:'market',discarded:0};});
  S.bags={};S.inspIdx=0;S.offer=0;S.offerItems={hand:[],stall:{}};S.bounty={};S.last=null;S.log=[];S.phase='prep';
}
function canReshuffle(S){return S.piles.some(function(p){return p.length>1;});}
function reshuffle(S,rnd){
  rnd=rnd||Math.random;
  let pool=[];
  S.piles.forEach(function(p){
    if(p.length>1){const top=p[p.length-1];pool=pool.concat(p.slice(0,-1));p.length=0;p.push(top);}
  });
  shuffle(pool,rnd);
  S.deck=S.deck.concat(pool);
}
function freshDeck(S,rnd){
  // ไพ่หมดจริง (สินค้าไปอยู่ในแผงหมด) — เติมสำรองชุดใหม่ให้เกมเดินต่อได้
  const add=[];
  ALL.forEach(function(t){for(let i=0;i<DECK_COUNTS[t];i++)add.push({id:S.nextId++,t:t});});
  shuffle(add,rnd||Math.random);
  S.deck=S.deck.concat(add);
  S.extra+=add.length;
}
function drawCard(S,pi,src,rnd){
  const pr=S.prep[pi],p=S.players[pi];
  if(S.phase!=='prep'||!pr||pr.step!=='market'||p.hand.length>=HAND)return false;
  if(src==='deck'){
    if(!S.deck.length&&canReshuffle(S))reshuffle(S,rnd);
    if(!S.deck.length)freshDeck(S,rnd);
    p.hand.push(S.deck.pop());return true;
  }
  const pile=S.piles[src];
  if(!pile||!pile.length)return false;
  p.hand.push(pile.pop());return true;
}
function discardCards(S,pi,ids,pile){
  const pr=S.prep[pi],p=S.players[pi];
  if(S.phase!=='prep'||!pr||pr.step!=='market'||(pile!==0&&pile!==1))return false;
  ids=uniq(ids);
  if(!ids.length||pr.discarded+ids.length>DISCARD_MAX)return false;
  if(!ids.every(function(id){return p.hand.some(function(c){return c.id===id;});}))return false;
  ids.forEach(function(id){
    const k=p.hand.findIndex(function(c){return c.id===id;});
    S.piles[pile].push(p.hand.splice(k,1)[0]);pr.discarded++;
  });
  return true;
}
function toLoad(S,pi){
  const pr=S.prep[pi],p=S.players[pi];
  if(S.phase!=='prep'||!pr||pr.step!=='market'||p.hand.length<HAND)return false;
  pr.step='load';return true;
}
function loadBag(S,pi,ids,declared){
  const pr=S.prep[pi],p=S.players[pi];
  if(S.phase!=='prep'||!pr||pr.step!=='load')return false;
  ids=uniq(ids);
  if(ids.length<1||ids.length>BAG_MAX||LEGAL.indexOf(declared)<0)return false;
  if(!ids.every(function(id){return p.hand.some(function(c){return c.id===id;});}))return false;
  const cards=ids.map(function(id){
    const k=p.hand.findIndex(function(c){return c.id===id;});
    return p.hand.splice(k,1)[0];
  });
  S.bags[pi]={cards:cards,declared:declared};
  pr.step='done';
  if(S.merchants.every(function(mi){return S.prep[mi].step==='done';})){
    S.phase='inspect';S.inspIdx=0;S.offer=0;S.offerItems={hand:[],stall:{}};S.bounty={};S.inspStartAt=Date.now();
  }
  return true;
}
function offerEmpty(S){
  const o=S.offerItems;
  return !(S.offer>0||o.hand.length>0||Object.keys(o.stall).some(function(k){return o.stall[k]>0;}));
}
function describeGave(g){
  const parts=[];
  if(g.coins>0)parts.push(g.coins+' เหรียญ');
  const st=Object.keys(g.stall).filter(function(t){return g.stall[t]>0;}).map(function(t){return GOODS[t].emoji+'×'+g.stall[t];});
  if(st.length)parts.push('สินค้าจากแผง '+st.join(' '));
  if(g.hand.length)parts.push('ไพ่จากมือ '+g.hand.map(function(c){return GOODS[c.t].emoji;}).join(''));
  return parts.join(' + ');
}
function cleanGift(p,amount,hand,stall){
  // ตรวจและตัดของที่เสนอให้เหลือเท่าที่ผู้เสนอมีจริง: เหรียญ + ไพ่จากมือ + สินค้าจากแผง
  let a=Math.floor(Number(amount));
  if(!isFinite(a)||a<0)a=0;
  const hs=uniq(Array.isArray(hand)?hand.map(Number):[]).filter(function(id){
    return p.hand.some(function(c){return c.id===id;});
  });
  const st={};
  if(stall&&typeof stall==='object'){
    ALL.forEach(function(t){
      let n=Math.floor(Number(stall[t]));
      if(isFinite(n)&&n>0){n=Math.min(n,p.stall[t]);if(n>0)st[t]=n;}
    });
  }
  return {coins:Math.min(a,p.coins),hand:hs,stall:st};
}
function giftEmpty(g){
  return !(g.coins>0||g.hand.length>0||Object.keys(g.stall).length>0);
}
function setOffer(S,amount,hand,stall){
  // ข้อเสนอสินบนของพ่อค้าเจ้าของถุง (ส่งใหม่ทั้งชุดทุกครั้ง)
  if(S.phase!=='inspect')return false;
  const g=cleanGift(S.players[S.merchants[S.inspIdx]],amount,hand,stall);
  S.offer=g.coins;
  S.offerItems={hand:g.hand,stall:g.stall};
  return true;
}
function setBounty(S,pi,amount,hand,stall){
  // ผู้เล่นอื่น (ไม่ใช่นายตรวจ/เจ้าของถุง) เสนอของให้นายตรวจเปิดถุงที่กำลังตรวจ — มอบให้จริงเมื่อนายตรวจเปิดถุงเท่านั้น
  if(S.phase!=='inspect'||!S.players[pi])return false;
  if(pi===S.sheriff||pi===S.merchants[S.inspIdx])return false;
  const g=cleanGift(S.players[pi],amount,hand,stall);
  if(giftEmpty(g))delete S.bounty[pi];else S.bounty[pi]=g;
  return true;
}
function handOver(from,to,g){
  const gave={coins:0,hand:[],stall:{}};
  gave.coins=pay(from,to,g.coins);
  g.hand.forEach(function(id){
    const k=from.hand.findIndex(function(c){return c.id===id;});
    if(k>=0){const c=from.hand.splice(k,1)[0];to.stall[c.t]++;gave.hand.push(c);}
  });
  Object.keys(g.stall).forEach(function(t){
    const n=Math.min(g.stall[t],from.stall[t]);
    if(n>0){from.stall[t]-=n;to.stall[t]+=n;gave.stall[t]=n;}
  });
  return gave;
}
function pay(from,to,amt){
  const a=Math.max(0,Math.min(amt,from.coins));
  from.coins-=a;to.coins+=a;return a;
}
function resolve(S,mode){
  if(S.phase!=='inspect')return null;
  const mi=S.merchants[S.inspIdx];
  const m=S.players[mi],sh=S.players[S.sheriff],bag=S.bags[mi];
  if(mode==='bribe'&&offerEmpty(S))return null;
  const truth=bag.cards.every(function(c){return c.t===bag.declared;});
  const res={merchant:mi,declared:bag.declared,cards:bag.cards.slice(),mode:mode,truth:truth,paid:0,due:0,honest:null,kept:[],seized:[],bounty:[]};
  if(mode==='bribe'){
    res.due=Math.min(S.offer,m.coins);
    const gave=handOver(m,sh,{coins:S.offer,hand:S.offerItems.hand,stall:S.offerItems.stall});
    res.paid=gave.coins;
    res.gave=gave;
    res.kept=bag.cards.slice();
    S.log.push(m.name+' จ่ายสินบน '+describeGave(gave)+' ให้ '+sh.name+' — ถุงผ่านโดยไม่เปิด');
  }else if(mode==='pass'){
    res.kept=bag.cards.slice();
    S.log.push(sh.name+' ปล่อยถุงของ '+m.name+' ผ่านโดยไม่เปิด');
  }else{
    const who=[];
    Object.keys(S.bounty).forEach(function(k){
      const pi=Number(k),gv=handOver(S.players[pi],sh,S.bounty[k]);
      if(!giftEmpty(gv)){res.bounty.push({seat:pi,paid:gv.coins,gave:gv});who.push(S.players[pi].name+' '+describeGave(gv));}
    });
    if(who.length)S.log.push(who.join(' · ')+' มอบให้ '+sh.name+' เพื่อให้เปิดถุงของ '+m.name);
    const kept=[],seized=[];
    bag.cards.forEach(function(c){(c.t===bag.declared?kept:seized).push(c);});
    if(!seized.length){
      res.honest=true;
      res.due=GOODS[bag.declared].pen*bag.cards.length;
      res.paid=pay(sh,m,res.due);
      S.log.push(sh.name+' เปิดถุงของ '+m.name+' — พูดจริง! จ่ายค่าปรับ '+res.paid+' เหรียญ');
    }else{
      res.honest=false;
      res.due=seized.reduce(function(s,c){return s+GOODS[c.t].pen;},0);
      res.paid=pay(m,sh,res.due);
      seized.forEach(function(c){const k=S.piles[0].length<=S.piles[1].length?0:1;S.piles[k].push(c);});
      S.log.push(sh.name+' เปิดถุงของ '+m.name+' — จับได้! ยึด '+seized.length+' ใบ ค่าปรับ '+res.paid+' เหรียญ');
    }
    res.kept=kept;res.seized=seized;
  }
  res.kept.forEach(function(c){m.stall[c.t]++;});
  const stt=S.stats,ms=stt[mi],ss=stt[S.sheriff];
  ms.bags++;
  if(!truth){ms.lies++;if(mode!=='inspect')ms.liesPassed++;}
  if(mode==='inspect'){
    ss.inspected++;
    if(res.honest){ss.honestOpened++;ss.penPaid+=res.paid;ms.penGot+=res.paid;}
    else{ms.caught++;ms.penPaid+=res.paid;ss.penGot+=res.paid;}
  }else if(mode==='pass'){ss.passed++;}
  else{
    const gv=giftValue(res.gave);
    ms.bribeGiven+=gv;ms.bribeGivenCount++;ss.bribeTaken+=gv;ss.bribeTakenCount++;
  }
  res.kept.forEach(function(c){if(!GOODS[c.t].legal)ms.contrabandPassed++;});
  res.bounty.forEach(function(b){stt[b.seat].bountyGiven+=giftValue(b.gave);});
  delete S.bags[mi];
  S.offer=0;S.offerItems={hand:[],stall:{}};S.bounty={};
  S.last=res;S.phase='result';
  return res;
}
function nextAfterResult(S){
  if(S.phase!=='result')return false;
  S.inspIdx++;S.last=null;S.offer=0;S.offerItems={hand:[],stall:{}};S.bounty={};
  S.phase=S.inspIdx>=S.merchants.length?'roundEnd':'inspect';
  if(S.phase==='inspect')S.inspStartAt=Date.now();
  return true;
}
function startNextRound(S){
  if(S.phase!=='roundEnd')return false;
  S.roundNo++;
  if(S.roundNo>=S.totalRounds){S.phase='final';return true;}
  S.sheriff=(S.sheriff+1)%S.players.length;
  beginRound(S);
  return true;
}
function score(S){
  const eff=S.players.map(function(p){
    const c={};LEGAL.forEach(function(k){c[k]=p.stall[k];});
    ALL.forEach(function(k){const b=GOODS[k].bonus;if(b)for(const t in b)c[t]+=b[t]*p.stall[k];});
    return c;
  });
  const bonus=S.players.map(function(){return 0;});
  const bonusList=S.players.map(function(){return [];});
  const kq=[];
  LEGAL.forEach(function(t){
    const g=GOODS[t];
    const arr=eff.map(function(c,i){return {i:i,n:c[t]};}).filter(function(x){return x.n>0;}).sort(function(a,b){return b.n-a.n;});
    if(!arr.length){kq.push({t:t,kings:[],queens:[],tie:false});return;}
    const top=arr[0].n;
    const kings=arr.filter(function(x){return x.n===top;});
    if(kings.length>1){
      const share=Math.floor((g.king+g.queen)/kings.length);
      kings.forEach(function(x){bonus[x.i]+=share;bonusList[x.i].push({t:t,role:'tie',amt:share});});
      kq.push({t:t,kings:kings.map(function(x){return x.i;}),queens:[],tie:true});
    }else{
      bonus[kings[0].i]+=g.king;bonusList[kings[0].i].push({t:t,role:'king',amt:g.king});
      const rest=arr.filter(function(x){return x.n<top;});
      let queens=[];
      if(rest.length){
        const q=rest[0].n;
        queens=rest.filter(function(x){return x.n===q;});
        const share=Math.floor(g.queen/queens.length);
        queens.forEach(function(x){bonus[x.i]+=share;bonusList[x.i].push({t:t,role:'queen',amt:share});});
      }
      kq.push({t:t,kings:[kings[0].i],queens:queens.map(function(x){return x.i;}),tie:false});
    }
  });
  const rows=S.players.map(function(p,i){
    let goods=0;ALL.forEach(function(k){goods+=GOODS[k].value*p.stall[k];});
    return {i:i,name:p.name,coins:p.coins,goods:goods,bonus:bonus[i],bonusList:bonusList[i],total:p.coins+goods+bonus[i]};
  });
  return {rows:rows,kq:kq};
}

function awards(S){
  const defs=[
    {k:'liar',icon:'🤥',title:'นักโกหกตัวยง',f:'lies',t:function(v){return 'โกหกในถุง '+v+' ครั้ง';}},
    {k:'smooth',icon:'😏',title:'เนียนกริบ',f:'liesPassed',t:function(v){return 'โกหกแล้วผ่านด่านไปได้ '+v+' ครั้ง';}},
    {k:'caught',icon:'🚨',title:'ซวยที่สุด',f:'caught',t:function(v){return 'ถูกจับได้ '+v+' ครั้ง';}},
    {k:'smuggler',icon:'🏴‍☠️',title:'จอมลักลอบ',f:'contrabandPassed',t:function(v){return 'ลักของเถื่อนผ่านด่าน '+v+' ใบ';}},
    {k:'briber',icon:'💰',title:'ราชาสินบน',f:'bribeGiven',t:function(v){return 'จ่ายสินบนมูลค่ารวม '+v+' เหรียญ';}},
    {k:'takenSheriff',icon:'🤫',title:'นายตรวจรับใต้โต๊ะ',f:'bribeTaken',t:function(v){return 'รับสินบนมูลค่ารวม '+v+' เหรียญ';}},
    {k:'wrong',icon:'🤦',title:'สงสัยผิดคน',f:'honestOpened',t:function(v){return 'เปิดถุงคนพูดจริง '+v+' ครั้ง';}},
    {k:'strict',icon:'🔍',title:'นายตรวจเหล็ก',f:'inspected',t:function(v){return 'เปิดถุงตรวจ '+v+' ครั้ง';}},
    {k:'maker',icon:'🕴️',title:'ผู้ชักใย',f:'bountyGiven',t:function(v){return 'เสนอให้เปิดถุงรวมมูลค่า '+v+' เหรียญ';}}
  ];
  return defs.map(function(d){
    const vals=S.stats.map(function(x){return x[d.f];});
    const max=Math.max.apply(null,vals);
    if(!(max>0))return null;
    return {key:d.k,icon:d.icon,title:d.title,text:d.t(max),
      seats:vals.map(function(v,i){return v===max?i:-1;}).filter(function(i){return i>=0;})};
  }).filter(Boolean);
}

return {awards:awards,describeGave:describeGave,GOODS:GOODS,ALL:ALL,LEGAL:LEGAL,HAND:HAND,BAG_MAX:BAG_MAX,DISCARD_MAX:DISCARD_MAX,
  newGame:newGame,drawCard:drawCard,discardCards:discardCards,toLoad:toLoad,loadBag:loadBag,
  setOffer:setOffer,setBounty:setBounty,resolve:resolve,nextAfterResult:nextAfterResult,startNextRound:startNextRound,score:score};
});

</script>
<script>
(function(){
'use strict';
var Eng=window.Engine;
var GOODS=Eng.GOODS,ALL=Eng.ALL,LEGAL=Eng.LEGAL,HAND=Eng.HAND,BAG_MAX=Eng.BAG_MAX,DISCARD_MAX=Eng.DISCARD_MAX;
var $=function(id){return document.getElementById(id);};
var elHdr=$('hdr'),elBars=$('bars'),elStrip=$('strip'),elView=$('view'),elChat=$('chat'),elLog=$('chatlog'),elInp=$('chatinp'),elOv=$('ov');

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function ssGet(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function ssSet(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){}}

var qs='';try{qs=new URLSearchParams(location.search).get('room')||'';}catch(e){}
var ui={online:false,name:lsGet('omg-name')||'',code:qs.toUpperCase().slice(0,6),error:'',toast:'',
  sel:new Set(),declared:null,offer:0,offerHand:new Set(),offerStall:{},bounty:0,bountyHand:new Set(),bountyStall:{},offerKey:'',rules:false,goods:false,kickAsk:-1,confirmEnd:false};
var V=null,ws=null,retry=0,chatLog=[],session=null;
try{var raw=ssGet('omg-session');session=raw?JSON.parse(raw):null;}catch(e){session=null;}

var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
function numTag(i){return ' <span class="dim">เบอร์'+(i+1)+'</span>';}
function pname(idx){return esc(V.players[idx].name)+numTag(idx);}
var G=function(t){return GOODS[t];};
var goodImg=function(t){return '/img/'+t+'.jpg';};
var sortHand=function(h){return h.slice().sort(function(a,b){return ALL.indexOf(a.t)-ALL.indexOf(b.t)||a.id-b.id;});};
var toTop=function(){try{window.scrollTo(0,0);}catch(e){}};

/* ---------- เครือข่าย ---------- */
function connect(){
  var sock;
  try{sock=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');}
  catch(e){setTimeout(connect,2000);return;}
  ws=sock;
  sock.onopen=function(){
    retry=0;ui.online=true;
    if(session)send({t:'rejoin',code:session.code,token:session.token});
    renderAll();
  };
  sock.onmessage=function(ev){
    var m;try{m=JSON.parse(ev.data);}catch(e){return;}
    onMsg(m);
  };
  sock.onclose=function(){
    if(ws!==sock)return;
    ui.online=false;renderAll();
    setTimeout(connect,Math.min(5000,800+(retry++)*700));
  };
  sock.onerror=function(){};
}
function send(o){
  if(ws&&ws.readyState===1){
    ws.send(JSON.stringify(o));return true;
  }
  return false;
}
function onMsg(m){
  if(m.t==='hello'){
    session={code:m.code,token:m.token};ssSet('omg-session',JSON.stringify(session));ui.error='';
  }else if(m.t==='state'){
    V=m.v;chatLog=V.chat||[];ui.error='';
    if(ui.kickAsk>=V.members.length||V.phase!=='lobby')ui.kickAsk=-1;
    if(V.phase!=='game')ui.confirmEnd=false;
    if(V.phase==='game'){
      var hand=V.players[V.me].hand||[];
      ui.sel.forEach(function(id){if(!hand.some(function(c){return c.id===id;}))ui.sel.delete(id);});
      var st=V.prep&&V.prep[V.me];
      if(V.gphase!=='prep'||(st&&st.step==='done')){ui.sel=new Set();ui.declared=null;}
      var key=V.roundNo+':'+V.inspIdx;
      if(ui.offerKey!==key){ui.offerKey=key;ui.offer=V.offer||0;syncOfferItems();syncBountyItems();}
      else if(V.gphase==='inspect'&&V.me!==V.merchants[V.inspIdx]){ui.offer=V.offer||0;syncOfferItems();}
    }
    renderAll();
  }else if(m.t==='chat'){
    if(!chatLog.some(function(x){return x.id===m.m.id;}))chatLog.push(m.m);
    renderChat();
  }else if(m.t==='error'){
    ui.error=m.msg;
    if(m.fatal){session=null;ssSet('omg-session',null);V=null;}
    renderAll();
  }else if(m.t==='kicked'){

function giveText(g){
  var parts=[];
  if(g.coins>0)parts.push(g.coins+' เหรียญ');
  var st=Object.keys(g.stall||{}).filter(function(t){return g.stall[t]>0;}).map(function(t){return G(t).emoji+'×'+g.stall[t];});
  if(st.length)parts.push('สินค้าจากแผง '+st.join(' '));
  if(g.hand&&g.hand.length)parts.push('ไพ่จากมือ '+g.hand.map(function(c){return G(c.t).emoji;}).join(''));
  return parts.join(' + ');
}
function sheriffWaitMs(){

function emblem(){
  return '<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 4h20v8c0 6-5 9-10 11C8 21 3 18 3 12Z" fill="var(--gold)" stroke="var(--goldink)" stroke-width="1.5"/><path d="M8 9h10M8 13h10" stroke="var(--goldink)" stroke-width="1.5" stroke-linecap="round"/></svg>';
}
function cardBtn(c,sel,actName){
  var g=G(c.t);
  return '<button class="card '+(g.legal?'legal':'contra')+(sel?' sel':'')+'" data-act="'+(actName||'toggle')+'" data-id="'+c.id+'" aria-pressed="'+sel+'" aria-label="'+g.name+(g.legal?'':' (เถื่อน)')+'">'+
    '<img class="gimg" data-good="'+c.t+'" src="'+goodImg(c.t)+'" alt="" loading="lazy">'+
    (g.legal?'':'<span class="tag contra">เถื่อน</span>')+'</button>';
}

/* ---------- ส่วนหัว/แถบ ---------- */
function renderHdr(){
  elHdr.innerHTML='<header class="top"><div class="brand">'+emblem()+'<span>ด่านตลาดเก่า</span></div><div class="tools">'+
    (V&&V.phase==='game'&&V.gphase!=='final'?'<span class="round">รอบ '+(V.roundNo+1)+'/'+V.totalRounds+'</span>':'')+
    (V?'<span class="code" title="รหัสห้อง">'+esc(V.code)+'</span>':'')+
    '<button class="ghost" data-act="rules">กติกา</button>'+
    '<button class="ghost goodsbtn" data-act="goods" aria-label="ดูราคาสินค้า">💰 ราคาสินค้า</button>'+
    (V?'<button class="ghost" data-act="leave">ออก</button>':'')+
    '</div></header>';
}
function renderBars(){
  var h='';
  if(!ui.online)h+='<div class="bar" role="status"><span>ขาดการเชื่อมต่อ กำลังต่อใหม่…</span></div>';
  if(ui.error)h+='<div class="bar" role="alert"><span>'+esc(ui.error)+'</span><span class="row"><button class="btn" data-act="dismiss">ปิด</button></span></div>';
  if(ui.toast)h+='<div class="bar ok" role="status"><span>'+esc(ui.toast)+'</span></div>';
  elBars.innerHTML=h;
}
function renderStrip(){
  if(!V||V.phase!=='game'||V.gphase==='final'){elStrip.innerHTML='';return;}
  elStrip.innerHTML='<div class="strip">'+V.players.map(function(p,i){
    var stall=ALL.filter(function(k){return p.stall[k]>0;}).map(function(k){return '<span class="'+(G(k).legal?'':'x')+'" title="'+G(k).name+'">'+G(k).emoji+p.stall[k]+'</span>';}).join('')||'<span class="dim">แผงว่าง</span>';
    return '<div class="pl'+(i===V.sheriff?' sheriff':'')+(i===V.me?' me':'')+'"><div class="pn">'+esc(p.name)+numTag(i)+(p.bot?' <span class="botbadge" title="บอท">🤖</span>':'')+(i===V.me?' <span class="dim">(คุณ)</span>':'')+(i===V.sheriff?'<span class="badge">นายตรวจ</span>':'')+(!p.bot&&!p.online?'<span class="off">ออฟไลน์</span>':'')+'</div>'+
      '<div class="pc"><i class="coin"></i>'+p.coins+'</div><div class="ps">'+stall+'</div></div>';
  }).join('')+'</div>';
}

/* ---------- หน้าจอ ---------- */
function landingView(){
  var dis=ui.online?'':' disabled';
  return '<section class="stage">'+
    '<div class="hero"><h1>โกหกให้แนบเนียน ผ่านด่านให้ได้</h1>'+sackSVG()+'</div>'+
    '<p class="lead">เล่นออนไลน์กับเพื่อนคนละเครื่อง 2–20 คน สร้างห้องแล้วส่งลิงก์หรือรหัสห้องให้เพื่อน</p>'+
    '<label class="fld"><span>ชื่อของคุณ</span><input id="nameIn" maxlength="14" autocomplete="off" value="'+esc(ui.name)+'" placeholder="เช่น มะลิ"></label>'+
    '<button class="btn primary block" data-act="create"'+dis+'>สร้างห้องใหม่</button>'+
    '<p class="center dim sm">หรือเข้าห้องของเพื่อน</p>'+
    '<label class="fld"><span>รหัสห้อง</span><input id="codeIn" maxlength="6" autocapitalize="characters" autocomplete="off" value="'+esc(ui.code)+'" placeholder="เช่น K7M2Q"></label>'+
    '<button class="btn block" data-act="join"'+dis+'>เข้าร่วมห้อง</button>'+
    '<a class="btn block discord" href="https://discord.gg/XqBBQB9CkM" target="_blank" rel="noopener noreferrer">เข้ากลุ่ม Discord</a></section>';
}
function lobbyView(){
  var isHost=V.host===V.me;
  var link='';try{link=location.origin+'/?room='+V.code;}catch(e){}
  var list=V.members.map(function(m,i){
    var kick='';
    if(isHost&&i!==V.me){
      kick=ui.kickAsk===i
        ?'<span class="pair"><button class="btn danger sm2" data-act="kickYes" data-i="'+i+'">เตะออก</button><button class="btn sm2" data-act="kickNo">ยกเลิก</button></span>'
        :'<button class="btn sm2" data-act="kickAsk" data-i="'+i+'" aria-label="เตะ '+esc(m.name)+'">เตะ</button>';
    }
    return '<li>'+(m.bot?'<span class="botbadge" title="บอท">🤖</span>':'<span class="dot '+(m.online?'on':'')+'"></span>')+esc(m.name)+numTag(i)+(i===V.me?' <span class="dim">(คุณ)</span>':'')+(i===V.host?' <span class="badge">โฮสต์</span>':'')+(!m.bot&&!m.online?' <span class="off">ออฟไลน์</span>':'')+kick+'</li>';
  }).join('');
  var out='<section class="stage"><div class="center"><p class="dim">รหัสห้อง</p><h2 class="bigcode">'+esc(V.code)+'</h2></div>'+
    '<div><input class="linkbox" readonly value="'+esc(link)+'" aria-label="ลิงก์เชิญ"><button class="btn block" style="margin-top:8px" data-act="copyLink">คัดลอกลิงก์เชิญ</button></div>'+
    '<div><h3 class="lb">ผู้เล่น '+V.members.length+' คน</h3><ul class="plist">'+list+'</ul>'+
    (isHost?'<button class="btn block" style="margin-top:10px" data-act="addBot"'+(V.members.length>=20?' disabled':'')+'>+ เพิ่มบอท</button>':'')+'</div>';
  if(isHost){
    var sc=V.startCoins==null?50:V.startCoins;
    var dl=V.inspectDelay==null?10:V.inspectDelay;
    out+='<div><h3 class="lb">ตั้งค่าเกม</h3>'+
      '<p class="dim sm" style="margin-top:8px">เป็นนายตรวจคนละกี่รอบ</p>'+
      '<div class="bribe" style="margin-top:4px"><button class="step" data-act="roundsAdj" data-d="-1" aria-label="ลดจำนวนรอบ">−</button><input id="roundsIn" type="number" inputmode="numeric" min="1" max="50" value="'+V.rounds+'" aria-label="จำนวนรอบต่อคน"><button class="step" data-act="roundsAdj" data-d="1" aria-label="เพิ่มจำนวนรอบ">+</button></div>'+
      '<p class="dim sm center" style="margin-top:6px">รวม '+(V.members.length*V.rounds)+' รอบ · ประมาณ '+Math.round(V.members.length*V.rounds*3)+' นาที · ตั้งได้ 1–50 รอบต่อคน</p>'+
      '<p class="dim sm" style="margin-top:14px">เหรียญเริ่มต้นของผู้เล่นแต่ละคน</p>'+
      '<div class="bribe" style="margin-top:4px"><button class="step" data-act="coinsAdj" data-d="-10" aria-label="ลดเหรียญเริ่มต้น">−</button><input id="coinsIn" type="number" inputmode="numeric" min="0" max="999" step="10" value="'+sc+'" aria-label="เหรียญเริ่มต้น"><button class="step" data-act="coinsAdj" data-d="10" aria-label="เพิ่มเหรียญเริ่มต้น">+</button></div>'+
      '<p class="dim sm center" style="margin-top:6px">ค่าเริ่มต้น 50 เหรียญ · ตั้งได้ 0–999 เหรียญ</p>'+

  return '<div class="note '+(truth?'t':'f')+'">ถุงของคุณ: ประกาศ '+b.cards.length+' × '+G(b.declared).emoji+' '+G(b.declared).name+' · ของจริง '+real+' — '+(truth?'พูดจริง':'โกหก')+'</div>';

    var nm=function(a){return a.map(function(i){return pname(i);}).join(', ');};
    if(!k.kings.length)return '<div>'+G(k.t).emoji+' '+G(k.t).name+': ไม่มีใครมีสินค้าชนิดนี้</div>';
    return '<div>'+G(k.t).emoji+' '+G(k.t).name+': '+(k.tie?'ราชาร่วม '+nm(k.kings)+' (แบ่งโบนัส)':'ราชา '+nm(k.kings)+(k.queens.length?' · ราชินี '+nm(k.queens):''))+'</div>';
  }).join('');
  return '<section class="stage"><div class="center"><p class="dim">ผู้ชนะ</p><h2 style="font-size:32px">'+winners.map(function(w){return pname(w.i);}).join(' และ ')+'</h2></div>'+
    '<div class="rank">'+list+'</div>'+
    awardsHTML()+
    '<div><h3 class="lb">ราชาและราชินีของสินค้าถูกกฎหมาย</h3><div class="kq" style="margin-top:8px">'+kq+'</div></div>'+
    (V.host===V.me?'<button class="btn primary block" data-act="again">เล่นอีกครั้ง (กลับห้องรอ)</button>':'<p class="lead center">รอโฮสต์เริ่มเกมใหม่…</p>')+'</section>';
}
function rulesView(){
  return '<div class="ov" data-act="closeRules"><div class="sheet" role="dialog" aria-modal="true" aria-label="กติกา" data-stop="1">'+
    '<h2>กติกาโดยย่อ</h2>'+
    '<p class="lead">ได้เงินรวมมากที่สุดเมื่อจบเกมคือผู้ชนะ ทุกคนเริ่มด้วย 50 เหรียญและไพ่ 6 ใบ แต่ละรอบมีนายตรวจ 1 คน ที่เหลือเป็นพ่อค้า และผลัดกันเป็นนายตรวจจนครบ</p>'+
    '<h3 class="lb">พ่อค้า (ทุกคนจัดพร้อมกัน)</h3>'+
    '<ol><li>ทิ้งไพ่ได้สูงสุด 5 ใบลงกองทิ้ง A หรือ B แล้วจั่วให้ครบ 6 ใบ จั่วจากกองจั่วหรือใบบนสุดของกองทิ้งก็ได้</li>'+
    '<li>ใส่ไพ่ 1–5 ใบลงถุง แล้วประกาศว่าเป็นสินค้า<b>ถูกกฎหมายชนิดเดียว</b> (แอปเปิล ชีส ขนมปัง หรือไก่) ตามจำนวนที่ใส่จริง</li>'+
    '<li>โกหกได้! จะใส่ของเถื่อนหรือสินค้าอื่นปนก็ได้ ประกาศเป็นของเถื่อนไม่ได้</li></ol>'+
    '<h3 class="lb">นายตรวจ</h3>'+
    '<ul><li>ต่อรองกับพ่อค้าในแชต พ่อค้าเสนอสินบน (เหรียญ) ผ่านปุ่มในเกมได้</li>'+
    '<li>ผู้เล่นคนอื่น (ที่ไม่ใช่เจ้าของถุง) เสนอเหรียญ สินค้าจากแผง หรือไพ่จากมือให้นายตรวจเปิดถุงที่กำลังตรวจได้ มอบให้จริงก็ต่อเมื่อนายตรวจเปิดถุงนั้น (ถ้ารับสินบนหรือปล่อยผ่าน ไม่ต้องมอบ)</li>'+
    '<li><b>รับสินบน</b> แล้วต้องปล่อยถุงนั้นผ่านโดยไม่เปิด พ่อค้าเสนอสินบนเป็นเหรียญ สินค้าจากแผง หรือไพ่จากมือก็ได้ (รวมกันได้) ของที่รับไปเข้าแผงของนายตรวจ</li>'+
    '<li><b>ปล่อยผ่าน</b> โดยไม่เปิด</li>'+
    '<li><b>เปิดตรวจ</b> — ถ้าพ่อค้าพูดจริง นายตรวจจ่ายค่าปรับ (ต่อใบ) ให้พ่อค้า ถ้าโกหก ใบที่ไม่ตรงประกาศถูกยึด พ่อค้าจ่ายค่าปรับของใบเหล่านั้นให้นายตรวจ ส่วนใบที่ตรงประกาศผ่านเข้าแผง</li></ul>'+
    '<p>ของที่ผ่านด่านจะหงายขึ้นเข้าแผงของพ่อค้า (รวมของเถื่อนด้วย)</p>'+
    '<h3 class="lb">นับคะแนนตอนจบ</h3>'+
    '<ul><li>เหรียญที่มี + ขายทุกอย่างในแผงตามราคา</li>'+
    '<li>โบนัส: ใครมีสินค้าถูกกฎหมายชนิดใดมากที่สุดได้เป็น<b>ราชา</b> รองลงมาได้<b>ราชินี</b> ถ้าเสมอกันที่ราชา แบ่งโบนัสราชาและราชินีรวมกัน (ปัดลง) และไม่มีราชินี</li>'+
    '<li>ของเถื่อนในแผงนับเป็นสินค้าถูกกฎหมายเพิ่มให้ตามชนิด เพื่อแย่งตำแหน่งราชา/ราชินี (ดูรายละเอียดที่ปุ่ม "ราคาสินค้า")</li></ul>'+
    '<p class="dim sm">เกมนี้เป็นเกมสร้างเองแรงบันดาลใจจากเกมบลัฟบนโต๊ะ เหรียญและแผงของทุกคนแสดงเปิดเผยเพื่อความง่ายในการต่อรอง</p>'+
    '<button class="btn primary block" data-act="closeRules">ปิด</button></div></div>';
}
function goodsView(){
  var legalRows=LEGAL.map(function(k){
    var g=G(k);
    return '<tr><td class="gn"><span class="ge">'+g.emoji+'</span>'+g.name+'</td><td class="v">'+g.value+'</td><td class="p">'+g.pen+'</td>'+
      '<td class="b k">+'+g.king+'</td><td class="b q">+'+g.queen+'</td></tr>';
  }).join('');
  var contraRows=ALL.filter(function(k){return !G(k).legal;}).map(function(k){
    var g=G(k);
    var bn=Object.keys(g.bonus).map(function(t){return '<span class="chip x">'+G(t).emoji+' '+G(t).name+' ×'+g.bonus[t]+'</span>';}).join('');
    return '<tr><td class="gn"><span class="ge">'+g.emoji+'</span>'+g.name+'</td><td class="v">'+g.value+'</td><td class="p">'+g.pen+'</td><td class="gx" colspan="2">'+bn+'</td></tr>';
  }).join('');
  return '<div class="ov goodsov" data-act="closeGoods"><div class="sheet gsheet" role="dialog" aria-modal="true" aria-label="ราคาสินค้า" data-stop="1">'+
    '<h2>ราคาสินค้า</h2>'+
    '<table class="gtable"><thead><tr><th class="gn">สินค้า</th><th>ราคาขาย<small>ต่อใบ</small></th><th>ค่าปรับ<small>ต่อใบ</small></th><th>โบนัส<br>ราชา</th><th>โบนัส<br>ราชินี</th></tr></thead><tbody>'+
    '<tr class="grp"><td colspan="5">สินค้าถูกกฎหมาย <span class="badge">ประกาศในถุงได้</span></td></tr>'+legalRows+
    '<tr class="grp x"><td colspan="5">ของเถื่อน <span class="badge x">แอบใส่ได้ ประกาศไม่ได้</span> <span class="gsub">ผ่านด่านแล้วนับเพิ่มให้</span></td></tr>'+contraRows+
    '</tbody></table>'+
    '<p class="gnote">ราชา/ราชินี = คนที่มีสินค้าชนิดนั้นมากสุด/รองลงมาตอนจบเกม<br>ค่าปรับ: ถูกยึด พ่อค้าจ่ายนายตรวจต่อใบ · เปิดถุงที่พูดจริง นายตรวจจ่ายพ่อค้าตามสินค้าที่ประกาศ</p>'+
    '<button class="btn primary block" data-act="closeGoods">ปิด</button></div></div>';
}

/* ---------- วาดหน้าจอ ---------- */
function renderView(){
  var body;
  if(!V)body=landingView();
  else if(V.phase==='lobby')body=lobbyView();
  else{
    var p=V.gphase;
    body=p==='prep'?prepView():p==='inspect'?inspectView():p==='result'?resultView():p==='roundEnd'?roundEndView():finalView();
  }
  elView.innerHTML=body;
}
function renderChat(){
  elChat.hidden=!V;
  if(!V)return;
  var atBottom=elLog.scrollTop+elLog.clientHeight>=elLog.scrollHeight-40;
  elLog.innerHTML=chatLog.length?chatLog.map(function(m){
    return '<div class="msg'+(m.seat===V.me?' mine':'')+'"><b>'+esc(m.name)+numTag(m.seat)+'</b> '+esc(m.text)+'</div>';
  }).join(''):'<p class="dim sm">ยังไม่มีข้อความ — ใช้แชตต่อรอง ขู่ หรือหลอกกันได้เลย</p>';
  if(atBottom||chatLog.length<3)elLog.scrollTop=elLog.scrollHeight;
}
function renderOv(){elOv.innerHTML=ui.rules?rulesView():ui.goods?goodsView():'';}
function renderAll(){renderHdr();renderBars();renderStrip();renderView();renderChat();renderOv();}

/* ---------- การกระทำของผู้เล่น ---------- */
function flashToast(t,ms){ui.toast=t;renderBars();setTimeout(function(){if(ui.toast===t){ui.toast='';renderBars();}},ms||2000);}
function onAct(a,d){
  switch(a){
    case 'dismiss':ui.error='';renderBars();return;
    case 'create':
      lsSet('omg-name',ui.name);
      send({t:'create',name:ui.name});return;
    case 'join':
      if(!ui.code){ui.error='กรอกรหัสห้องก่อน';renderBars();return;}
      lsSet('omg-name',ui.name);
      send({t:'join',code:ui.code,name:ui.name});return;
    case 'copyLink':{
      var link=location.origin+'/?room='+V.code;
      try{navigator.clipboard.writeText(link).then(function(){flashToast('คัดลอกลิงก์แล้ว');},function(){flashToast('คัดลอกไม่ได้ ให้กดค้างที่ช่องลิงก์แล้วคัดลอกเอง');});}
      catch(e){flashToast('คัดลอกไม่ได้ ให้กดค้างที่ช่องลิงก์แล้วคัดลอกเอง');}
      return;
    }
    case 'addBot':send({t:'addBot'});return;
    case 'roundsAdj':send({t:'settings',rounds:Math.max(1,Math.min(50,V.rounds+(+d.d)))});return;
    case 'coinsAdj':send({t:'settings',coins:Math.max(0,Math.min(999,(V.startCoins==null?50:V.startCoins)+(+d.d)))});return;
    case 'delayAdj':send({t:'settings',delay:Math.max(0,Math.min(60,(V.inspectDelay==null?10:V.inspectDelay)+(+d.d)))});return;
    case 'start':send({t:'start'});return;
    case 'leave':send({t:'leave'});session=null;ssSet('omg-session',null);V=null;chatLog=[];renderAll();return;
    case 'rules':ui.rules=true;renderOv();return;
    case 'closeRules':ui.rules=false;renderOv();return;
    case 'goods':ui.goods=true;renderOv();return;
    case 'closeGoods':ui.goods=false;renderOv();return;
    case 'toggle':{
      var id=+d.id;
      if(ui.sel.has(id))ui.sel.delete(id);
      else{
        var st=V.prep[V.me];
        var max=st.step==='load'?BAG_MAX:DISCARD_MAX-st.discarded;
        if(ui.sel.size<max)ui.sel.add(id);
      }
      renderView();return;
    }
    case 'decl':ui.declared=d.t;renderView();return;
    case 'discard':act('discard',{ids:Array.from(ui.sel),pile:+d.pile});ui.sel=new Set();return;
    case 'draw':act('draw',{src:d.src==='deck'?'deck':+d.src});return;
    case 'toLoad':act('toLoad');ui.sel=new Set();ui.declared=null;toTop();return;
    case 'seal':act('seal',{ids:Array.from(ui.sel),declared:ui.declared});return;
    case 'offerAdj':{
      var coins=V.players[V.insp.mi].coins;
      ui.offer=Math.max(0,Math.min(coins,ui.offer+(+d.d)));
      var inp=$('offerIn');if(inp)inp.value=ui.offer;refreshGiftSend();return;
    }
    case 'kickAsk':ui.kickAsk=+d.i;renderView();return;
    case 'kickNo':ui.kickAsk=-1;renderView();return;
    case 'kickYes':send({t:'kick',seat:+d.i});ui.kickAsk=-1;return;
    case 'endAsk':ui.confirmEnd=true;renderBars();return;
    case 'endNo':ui.confirmEnd=false;renderBars();return;
    case 'endYes':send({t:'endgame'});ui.confirmEnd=false;renderBars();return;
    case 'bountyAdj':{
      var bc=V.players[V.me].coins;
      ui.bounty=Math.max(0,Math.min(bc,ui.bounty+(+d.d)));
      var bi=$('bountyIn');if(bi)bi.value=ui.bounty;refreshGiftSend();return;
    }
    case 'bountyCard':{
      var bid=+d.id;
      if(ui.bountyHand.has(bid))ui.bountyHand.delete(bid);else ui.bountyHand.add(bid);
      renderView();return;
    }
    case 'bStallAdj':{
      var bme=V.players[V.me],bt=d.t;
      var bcur=ui.bountyStall[bt]||0,bnx=Math.max(0,Math.min(bme.stall[bt],bcur+(+d.d)));
      if(bnx>0)ui.bountyStall[bt]=bnx;else delete ui.bountyStall[bt];
      renderView();return;
    }
    case 'bountySend':act('bounty',{amount:ui.bounty,hand:Array.from(ui.bountyHand),stall:ui.bountyStall});return;
    case 'bountyClear':ui.bounty=0;ui.bountyHand=new Set();ui.bountyStall={};act('bounty',{amount:0,hand:[],stall:{}});return;
    case 'offerCard':{
      var oid=+d.id;
      if(ui.offerHand.has(oid))ui.offerHand.delete(oid);else ui.offerHand.add(oid);
      renderView();return;
    }
    case 'stallAdj':{
      var me0=V.players[V.me],tt=d.t;
      var cur=ui.offerStall[tt]||0,nx=Math.max(0,Math.min(me0.stall[tt],cur+(+d.d)));
      if(nx>0)ui.offerStall[tt]=nx;else delete ui.offerStall[tt];
      renderView();return;
    }
    case 'offerSend':act('offer',{amount:ui.offer,hand:Array.from(ui.offerHand),stall:ui.offerStall});return;
    case 'offerClear':ui.offer=0;ui.offerHand=new Set();ui.offerStall={};act('offer',{amount:0,hand:[],stall:{}});return;
    case 'accept':case 'pass':case 'inspect':case 'next':case 'nextRound':case 'again':act(a);toTop();return;
  }
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  if(el.classList.contains('ov')&&e.target.closest('[data-stop]'))return;
  onAct(el.dataset.act,el.dataset);
});
document.addEventListener('error',function(e){
  var img=e.target;
  if(!img||img.tagName!=='IMG'||!img.classList||!img.classList.contains('gimg')||img.dataset.fallenBack)return;
  img.dataset.fallenBack='1';
  var t=img.getAttribute('data-good'),g=t&&GOODS[t];
  var span=document.createElement('span');
  span.className='em gfallback';
  span.textContent=g?g.emoji:'❓';
  span.title=g?g.name:'';
  img.replaceWith(span);
},true);
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='nameIn')ui.name=t.value;
  else if(t.id==='codeIn'){ui.code=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(t.value!==ui.code)t.value=ui.code;}
  else if(t.id==='bountyIn'&&V&&V.players){
    var bcoins=V.players[V.me].coins;
    var bv=parseInt(t.value,10);if(isNaN(bv)||bv<0)bv=0;if(bv>bcoins)bv=bcoins;
    ui.bounty=bv;if(t.value!==''&&String(bv)!==t.value)t.value=bv;refreshGiftSend();
  }
  else if(t.id==='offerIn'&&V&&V.insp){
    var coins=V.players[V.insp.mi].coins;
    var v=parseInt(t.value,10);if(isNaN(v)||v<0)v=0;if(v>coins)v=coins;
    ui.offer=v;if(t.value!==''&&String(v)!==t.value)t.value=v;refreshGiftSend();
  }
});
function sendChat(){
  var text=(elInp.value||'').trim();
  if(!text)return;
  send({t:'chat',text:text});elInp.value='';
}
$('chatsend').addEventListener('click',sendChat);
elInp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendChat();}});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='roundsIn'&&V){
    var v=parseInt(t.value,10);if(isNaN(v)||v<1)v=1;if(v>50)v=50;
    t.value=v;send({t:'settings',rounds:v});
  }
  if(t.id==='coinsIn'&&V){
    var vc=parseInt(t.value,10);if(isNaN(vc)||vc<0)vc=0;if(vc>999)vc=999;
    t.value=vc;send({t:'settings',coins:vc});
  }
  if(t.id==='delayIn'&&V){
    var vd=parseInt(t.value,10);if(isNaN(vd)||vd<0)vd=0;if(vd>60)vd=60;
    t.value=vd;send({t:'settings',delay:vd});
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(ui.rules||ui.goods)){ui.rules=false;ui.goods=false;renderOv();}});

renderAll();
connect();
})();

</script>
